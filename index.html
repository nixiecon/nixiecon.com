<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nixiecon</title>
<link rel="icon" type="image/svg+xml" href="assets/glyph.svg">
<style>
  /* ============================================================
     nixiecon — single-page personal landing
     all CSS inline · no external runtime deps except Google Fonts
     ============================================================ */

  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --void:        #0a0614;
    --surface:     #13091f;
    --surface-2:   #1a0f2e;
    --surface-3:   #241640;
    --violet-300:  #c4b5fd;
    --violet-400:  #a78bfa;
    --violet-500:  #8b5cf6;
    --magenta:     #ec4899;
    --fg-1:        #ede9fe;
    --fg-2:        #a59cc4;
    --fg-3:        #6b6184;
    --line:        rgba(167, 139, 250, 0.15);
    --line-strong: rgba(167, 139, 250, 0.35);
    --glow:        0 0 32px rgba(167, 139, 250, 0.35);
    --glow-lg:     0 0 80px rgba(167, 139, 250, 0.45);
    --font-display:'Instrument Serif', Georgia, serif;
    --font-ui:     'Space Grotesk', -apple-system, system-ui, sans-serif;
    --font-mono:   'JetBrains Mono', 'SF Mono', Menlo, monospace;
    --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
  }

  html, body {
    height: 100%;
    background: var(--void);
    color: var(--fg-1);
    font-family: var(--font-ui);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  /* ---------- background layers ---------- */
  body {
    position: relative;
    display: grid;
    place-items: center;
    padding: 32px;
  }

  /* dot grid */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(167, 139, 250, 0.12) 1px, transparent 0);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 40%, transparent 85%);
  }

  /* the bloom — one source of light */
  body::after {
    content: "";
    position: fixed;
    left: 50%;
    top: 38%;
    width: 720px;
    height: 720px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(139, 92, 246, 0.45) 0%, rgba(139, 92, 246, 0.15) 30%, transparent 65%);
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
    animation: breathe 4s var(--ease-out) infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.04); }
  }

  /* ---------- main stack ---------- */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 420px;
    width: 100%;
    animation: fadeUp 800ms var(--ease-out) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- status pill (top metadata) ---------- */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    margin-bottom: 56px;
    background: rgba(19, 9, 31, 0.6);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--fg-3);
    text-transform: lowercase;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--violet-400);
    box-shadow: 0 0 8px var(--violet-400);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }

  /* ---------- wordmark ---------- */
  .wordmark {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(56px, 15vw, 144px);
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--fg-1);
    text-shadow: var(--glow-lg);
    margin-bottom: 8px;
    white-space: nowrap;
  }

  /* the blinking terminal cursor after the wordmark */
  .wordmark::after {
    content: "_";
    display: inline-block;
    margin-left: 0.08em;
    color: var(--violet-400);
    font-style: normal;
    transform: translateY(-0.1em);
    animation: blink 1.1s steps(2, start) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ---------- tagline — single line ---------- */
  .tagline {
    font-family: var(--font-ui);
    font-weight: 300;
    font-size: 13px;
    line-height: 1.5;
    color: var(--fg-2);
    margin-top: 8px;
    margin-bottom: 40px;
    white-space: nowrap;
  }

  .tagline em {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    color: var(--violet-300);
  }

  /* ---------- links (icon-only squares) ---------- */
  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 64px;
  }

  .link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: rgba(26, 15, 46, 0.5);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--fg-1);
    text-decoration: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition:
      background 180ms var(--ease-out),
      border-color 180ms var(--ease-out),
      color 180ms var(--ease-out),
      box-shadow 180ms var(--ease-out),
      transform 180ms var(--ease-out);
  }

  .link svg {
    width: 14px;
    height: 14px;
  }

  .link .label,
  .link .arrow {
    display: none;
  }

  .link:hover {
    background: rgba(36, 22, 64, 0.7);
    border-color: var(--line-strong);
    color: var(--violet-300);
    box-shadow: var(--glow);
  }

  .link:active {
    transform: scale(0.94);
  }

  /* ---------- tip row (subtle payment links) ---------- */
  .tips {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    justify-content: center;
    gap: 6px;
    margin-top: -48px;
    margin-bottom: 64px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: lowercase;
    color: var(--fg-3);
    white-space: nowrap;
  }

  .tips .tips-label {
    color: var(--fg-3);
    opacity: 0.7;
    margin-right: 4px;
    user-select: none;
  }

  .tip {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 22px;
    padding: 0 10px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg-2);
    text-decoration: none;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition:
      background 180ms var(--ease-out),
      border-color 180ms var(--ease-out),
      color 180ms var(--ease-out),
      box-shadow 180ms var(--ease-out),
      transform 180ms var(--ease-out);
  }

  .tip:hover,
  .tip:focus-visible {
    color: var(--violet-300);
    border-color: var(--line-strong);
    background: rgba(26, 15, 46, 0.5);
    box-shadow: var(--glow);
    outline: none;
  }

  .tip:active { transform: scale(0.96); }

  /* tooltip showing the handle */
  .tip .handle {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    padding: 5px 9px;
    background: rgba(19, 9, 31, 0.92);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--violet-300);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .tip .handle::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 4px solid var(--line);
  }

  .tip:hover .handle,
  .tip:focus-visible .handle,
  .tip.copied .handle {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tip.copied .handle { color: var(--magenta); }

  /* ---------- footer ---------- */
  footer {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--fg-3);
    text-transform: lowercase;
    text-align: center;
    white-space: nowrap;
  }

  footer .sep {
    color: var(--fg-mute, #4a4360);
  }

  /* ---------- corner ticks ---------- */
  .tick {
    position: fixed;
    width: 16px;
    height: 16px;
    border-color: var(--line-strong);
    z-index: 1;
  }
  .tick.tl { top: 24px; left: 24px;     border-top: 1px solid; border-left: 1px solid; }
  .tick.tr { top: 24px; right: 24px;    border-top: 1px solid; border-right: 1px solid; }
  .tick.bl { bottom: 24px; left: 24px;  border-bottom: 1px solid; border-left: 1px solid; }
  .tick.br { bottom: 24px; right: 24px; border-bottom: 1px solid; border-right: 1px solid; }

  /* ---------- responsive ---------- */
  @media (max-width: 520px) {
    body { padding: 24px; overflow: auto; }
    body::after { width: 480px; height: 480px; }
    .status { margin-bottom: 40px; }
    .tagline { margin-bottom: 36px; font-size: 12px; white-space: normal; }
    .tagline em { font-size: 14px; }
    .links { gap: 6px; margin-bottom: 80px; }
    .tips { margin-top: -64px; margin-bottom: 88px; gap: 4px; }
    .tip { height: 20px; padding: 0 8px; font-size: 9px; }
    .tips .tips-label { display: none; }
    footer { font-size: 10px; gap: 8px; padding: 0 16px; }
    .tick { width: 12px; height: 12px; }
    .tick.tl, .tick.tr { top: 16px; }
    .tick.bl, .tick.br { bottom: 16px; }
    .tick.tl, .tick.bl { left: 16px; }
    .tick.tr, .tick.br { right: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- corner ticks (frame the void) -->
<span class="tick tl"></span>
<span class="tick tr"></span>
<span class="tick bl"></span>
<span class="tick br"></span>

<main>
  <div class="status">
    <span class="dot"></span>
    <span>online · sometimes</span>
  </div>

  <h1 class="wordmark">nixiecon</h1>

  <p class="tagline">
    geriatric millennial <em>&amp; chaos on a schedule</em>
  </p>

  <nav class="links">
    <a class="link" href="https://github.com" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.29-.01-1.04-.01-2.05-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.08 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 016 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.81 1.1.81 2.22 0 1.6-.02 2.89-.02 3.29 0 .32.22.7.83.58A12 12 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      <span class="label always">github</span>
      <span class="arrow">↗</span>
    </a>

    <a class="link" href="mailto:hi@nixiecon.com" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="m2 7 10 7 10-7"/>
      </svg>
      <span class="label">email</span>
      <span class="arrow">↗</span>
    </a>
  </nav>

  <div class="tips" aria-label="send a small thanks">
    <span class="tips-label">// keep the lights on</span>
    <button class="tip" type="button" data-copy="626-757-4700" aria-label="Zelle 626-757-4700, click to copy">
      zelle
      <span class="handle" data-default="626-757-4700">626-757-4700</span>
    </button>
    <a class="tip" href="https://venmo.com/nixiecon" target="_blank" rel="noopener" aria-label="Venmo @nixiecon">
      venmo
      <span class="handle">@nixiecon</span>
    </a>
    <a class="tip" href="https://paypal.me/nixiecon" target="_blank" rel="noopener" aria-label="PayPal @nixiecon">
      paypal
      <span class="handle">@nixiecon</span>
    </a>
    <a class="tip" href="https://cash.app/$nixiecon" target="_blank" rel="noopener" aria-label="Cash App $nixiecon">
      cash app
      <span class="handle">$nixiecon</span>
    </a>
  </div>
</main>

<script>
  // zelle: click to copy the phone number, briefly flash "copied"
  document.querySelectorAll('.tip[data-copy]').forEach(btn => {
    const handle = btn.querySelector('.handle');
    const original = handle.dataset.default;
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        handle.textContent = 'copied · ' + original;
        btn.classList.add('copied');
        clearTimeout(btn._t);
        btn._t = setTimeout(() => {
          btn.classList.remove('copied');
          handle.textContent = original;
        }, 1600);
      } catch (e) {
        // clipboard unavailable — leave the number visible in the tooltip
      }
    });
  });
</script>

<footer>
  <span>// nixiecon</span>
  <span class="sep">·</span>
  <span>est. 2026</span>
  <span class="sep">·</span>
  <span>made in the dark</span>
</footer>

</body>
</html>
