<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nixiecon</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --border: #1e1e2e;
  --text: #e2e4eb;
  --text-dim: #6b6f85;
  --accent: #8b5cf6;
  --accent-glow: rgba(139, 92, 246, 0.3);
  --green: #22c55e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(139,92,246,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,92,246,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* Ambient glow */
.glow {
  position: fixed;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  pointer-events: none;
}
.glow-1 {
  top: -200px;
  right: -100px;
  background: var(--accent);
}
.glow-2 {
  bottom: -200px;
  left: -100px;
  background: #06b6d4;
}

.main {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 40px;
  max-width: 640px;
}

.logo {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -2px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--accent), #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tagline {
  font-size: 16px;
  color: var(--text-dim);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 48px;
}

/* Terminal-style block */
.terminal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 28px;
  text-align: left;
  margin-bottom: 40px;
  position: relative;
  box-shadow: 0 0 40px rgba(0,0,0,0.3);
}
.terminal-dots {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
}
.terminal-dots span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.dot-red { background: #ef4444; }
.dot-yellow { background: #eab308; }
.dot-green { background: #22c55e; }

.terminal-line {
  font-size: 14px;
  line-height: 2;
  color: var(--text-dim);
}
.terminal-line .prompt {
  color: var(--accent);
}
.terminal-line .cmd {
  color: var(--text);
}
.terminal-line .output {
  color: var(--green);
}
.terminal-line .flag {
  color: #f97316;
}

.cursor {
  display: inline-block;
  width: 8px;
  height: 16px;
  background: var(--accent);
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}

/* Links row */
.links {
  display: flex;
  gap: 24px;
  justify-content: center;
  flex-wrap: wrap;
}
.links a {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: all 0.2s;
}
.links a:hover {
  color: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
}

/* Status indicator */
.status {
  position: fixed;
  bottom: 24px;
  right: 24px;
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 10;
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

@media (max-width: 600px) {
  .logo { font-size: 36px; }
  .tagline { font-size: 13px; letter-spacing: 3px; }
  .terminal { padding: 16px 20px; }
  .main { padding: 24px; }
}
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="main">
  <div class="logo">nixiecon</div>
  <div class="tagline">chaos on a schedule</div>

  <div class="terminal">
    <div class="terminal-dots">
      <span class="dot-red"></span>
      <span class="dot-yellow"></span>
      <span class="dot-green"></span>
    </div>
    <div class="terminal-line"><span class="prompt">$</span> <span class="cmd">whoami</span></div>
    <div class="terminal-line"><span class="output">nicole de vera</span></div>
    <div class="terminal-line"><span class="prompt">$</span> <span class="cmd">cat</span> <span class="flag">about.txt</span></div>
    <div class="terminal-line"><span class="output">ops nerd. automation builder.</span></div>
    <div class="terminal-line"><span class="output">turning "someone should automate that"</span></div>
    <div class="terminal-line"><span class="output">into "done, what's next?"</span></div>
    <div class="terminal-line"><span class="prompt">$</span> <span class="cmd">status</span> <span class="flag">--current</span></div>
    <div class="terminal-line"><span class="output">building things. breaking things (on purpose).</span></div>
    <div class="terminal-line"><span class="prompt">$</span> <span class="cursor"></span></div>
  </div>

  <div class="links">
    <a href="https://github.com/nixiecon">github</a>
    <a href="https://ndvstrategies.com">ndv strategies</a>
  </div>
</div>

<div class="status">
  <span class="status-dot"></span>
  systems operational
</div>

</body>
</html>
