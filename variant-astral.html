<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nixiecon ☾</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --void:        #07041a;
  --indigo:      #1e1052;
  --violet:      #a78bfa;
  --violet-300:  #c4b5fd;
  --violet-500:  #8b5cf6;
  --orchid:      #d946ef;
  --rose:        #f0abfc;
  --gold:        #fde68a;
  --fg:          #f5f3ff;
  --fg-2:        #c4b5fd;
  --fg-3:        #8b7eb8;
  --fg-mute:     #5b4d8f;
  --line:        rgba(196, 181, 253, 0.2);
  --line-strong: rgba(196, 181, 253, 0.5);
}

html, body {
  height: 100%;
  background:
    radial-gradient(ellipse at top, #1e1052 0%, #07041a 70%),
    var(--void);
  color: var(--fg);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  position: relative;
  display: grid;
  place-items: center;
  padding: 32px;
}

/* twinkling star field — three layers at different scales */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.stars::before,
.stars::after,
.stars > .layer {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 24%, #fff, transparent),
    radial-gradient(1px 1px at 87% 16%, #fff, transparent),
    radial-gradient(2px 2px at 38% 78%, #fde68a, transparent),
    radial-gradient(1px 1px at 64% 42%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 8% 62%, #c4b5fd, transparent),
    radial-gradient(1px 1px at 92% 88%, #fff, transparent),
    radial-gradient(2.5px 2.5px at 28% 12%, #f0abfc, transparent),
    radial-gradient(1px 1px at 72% 68%, #fff, transparent),
    radial-gradient(1px 1px at 53% 8%, #fde68a, transparent),
    radial-gradient(1.5px 1.5px at 18% 88%, #fff, transparent),
    radial-gradient(1px 1px at 82% 38%, #c4b5fd, transparent),
    radial-gradient(2px 2px at 48% 55%, #fff, transparent);
  background-size: 100% 100%;
  animation: twinkle 4s ease-in-out infinite;
}
.stars::after {
  animation-delay: 1.3s;
  opacity: 0.7;
}
.stars > .layer {
  animation-delay: 2.6s;
  opacity: 0.5;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.95; }
  50%      { opacity: 0.35; }
}

/* the orb — a softer bloom than the original */
.orb {
  position: fixed;
  left: 50%; top: 50%;
  width: 620px; height: 620px;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(circle, rgba(217, 70, 239, 0.35), transparent 40%),
    radial-gradient(circle, rgba(139, 92, 246, 0.45), transparent 65%);
  filter: blur(40px);
  pointer-events: none;
  z-index: 0;
  animation: bob 6s ease-in-out infinite;
}
@keyframes bob {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50%      { transform: translate(-50%, -52%) scale(1.04); }
}

/* floating sparkle glyphs around the wordmark */
.sparkle {
  position: absolute;
  font-family: 'Instrument Serif', serif;
  color: var(--rose);
  text-shadow: 0 0 12px rgba(240, 171, 252, 0.6);
  pointer-events: none;
  animation: float 5s ease-in-out infinite;
}
.sparkle.s1 { top: -10px; left: 6%;  font-size: 22px; animation-delay: 0s; }
.sparkle.s2 { top: 30%; right: 4%;   font-size: 16px; animation-delay: 1.2s; color: var(--violet-300); }
.sparkle.s3 { bottom: 18%; left: 12%; font-size: 18px; animation-delay: 2.4s; color: var(--gold); }
.sparkle.s4 { top: 50%; left: -6%;   font-size: 14px; animation-delay: 0.8s; }
.sparkle.s5 { bottom: 8%; right: 10%; font-size: 24px; animation-delay: 1.8s; color: var(--rose); }
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
  50%      { transform: translateY(-8px) rotate(8deg); opacity: 0.5; }
}

main {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 500px;
  width: 100%;
  animation: arrive 1200ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes arrive {
  from { opacity: 0; transform: scale(0.96); filter: blur(8px); }
  to   { opacity: 1; transform: scale(1); filter: blur(0); }
}

/* ---------- status ---------- */
.status {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  margin-bottom: 56px;
  background: rgba(7, 4, 26, 0.55);
  border: 1px solid var(--line);
  border-radius: 999px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fg-3);
  text-transform: lowercase;
}
.status .moon {
  font-size: 13px;
  color: var(--rose);
  text-shadow: 0 0 8px rgba(240, 171, 252, 0.6);
  animation: phase 4s ease-in-out infinite;
}
@keyframes phase {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

/* ---------- wordmark ---------- */
.mark-wrap {
  position: relative;
  display: inline-block;
  margin-bottom: 18px;
}
.mark {
  font-family: 'Instrument Serif', Georgia, serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(64px, 15vw, 140px);
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--fg);
  white-space: nowrap;
  background: linear-gradient(180deg, #fff 0%, #f0abfc 50%, #c4b5fd 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 60px rgba(217, 70, 239, 0.6);
  filter: drop-shadow(0 0 24px rgba(196, 181, 253, 0.5));
  position: relative;
}
.mark::after {
  content: "_";
  display: inline-block;
  margin-left: 0.05em;
  color: var(--rose);
  -webkit-text-fill-color: var(--rose);
  font-style: normal;
  transform: translateY(-0.1em);
  animation: blink 1.1s steps(2, start) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- tagline ---------- */
.tagline {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 300;
  font-size: 17px;
  line-height: 1.55;
  color: var(--fg-2);
  margin-top: 10px;
  margin-bottom: 48px;
  max-width: 380px;
  margin-left: auto;
  margin-right: auto;
}
.tagline em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 20px;
  color: var(--rose);
  text-shadow: 0 0 16px rgba(240, 171, 252, 0.4);
}
.tagline .glyph {
  color: var(--gold);
  margin: 0 4px;
}

/* ---------- links ---------- */
.links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 56px;
}
.link {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 11px 17px;
  background: rgba(30, 16, 82, 0.5);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--fg);
  text-decoration: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: lowercase;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  position: relative;
  overflow: hidden;
  transition: all 260ms cubic-bezier(0.22, 1, 0.36, 1);
}
.link svg { width: 15px; height: 15px; }
.link .star {
  font-size: 11px;
  color: var(--fg-3);
  transition: all 260ms cubic-bezier(0.22, 1, 0.36, 1);
}
.link::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(240, 171, 252, 0.25), transparent 60%);
  transform: translate(-50%, -50%);
  transition: width 360ms ease, height 360ms ease;
  pointer-events: none;
}
.link:hover {
  border-color: var(--rose);
  color: var(--fg);
  box-shadow: 0 0 24px rgba(217, 70, 239, 0.4);
}
.link:hover::before { width: 200%; height: 200%; }
.link:hover .star {
  color: var(--gold);
  transform: rotate(180deg) scale(1.3);
  text-shadow: 0 0 8px var(--gold);
}
.link:active { transform: scale(0.97); }

/* ---------- footer ---------- */
footer {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--fg-3);
  text-transform: lowercase;
  white-space: nowrap;
}
footer .glyph { color: var(--rose); }
footer .sep { color: var(--fg-mute); }

/* ---------- corner sigils ---------- */
.sigil {
  position: fixed;
  font-family: 'Instrument Serif', serif;
  font-size: 18px;
  color: var(--line-strong);
  z-index: 1;
  pointer-events: none;
}
.sigil.tl { top: 22px; left: 22px; }
.sigil.tr { top: 22px; right: 22px; }
.sigil.bl { bottom: 22px; left: 22px; }
.sigil.br { bottom: 22px; right: 22px; }

@media (max-width: 560px) {
  .link .label { display: none; }
  .link .label.always { display: inline; }
  .tagline { font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
