<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nixiecon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --void:        #0d0414;
  --void-2:      #1a0a23;
  --violet-300:  #c4b5fd;
  --violet-400:  #a78bfa;
  --violet-500:  #8b5cf6;
  --orchid:      #b362d4;
  --magenta:     #d946ef;
  --rose:        #e879a8;
  --gold:        #d4a574;
  --fg:          #f3e8ff;
  --fg-2:        #c9b9e0;
  --fg-3:        #8b7aa3;
  --fg-mute:     #5c4d70;
  --line:        rgba(196, 181, 253, 0.18);
  --line-strong: rgba(196, 181, 253, 0.42);
}

html, body {
  height: 100%;
  background: var(--void);
  color: var(--fg);
  font-family: 'Cormorant Garamond', Georgia, serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  position: relative;
  display: grid;
  place-items: center;
  padding: 32px;
}

/* lush moody floral atmosphere — radial gradients layered */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 600px 400px at 18% 22%, rgba(217, 70, 239, 0.22), transparent 60%),
    radial-gradient(ellipse 500px 380px at 88% 78%, rgba(139, 92, 246, 0.30), transparent 60%),
    radial-gradient(ellipse 400px 320px at 78% 18%, rgba(212, 165, 116, 0.10), transparent 65%),
    radial-gradient(ellipse 460px 360px at 8% 82%, rgba(76, 29, 149, 0.40), transparent 60%);
  filter: blur(20px);
  pointer-events: none;
  z-index: 0;
  animation: drift 12s ease-in-out infinite;
}
@keyframes drift {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50%      { transform: scale(1.06) rotate(0.5deg); }
}

/* soft film grain via repeating dots */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 25% 35%, rgba(196, 181, 253, 0.03) 1.5px, transparent 2px),
    radial-gradient(circle at 65% 75%, rgba(196, 181, 253, 0.03) 1.5px, transparent 2px),
    radial-gradient(circle at 85% 15%, rgba(196, 181, 253, 0.03) 1.5px, transparent 2px);
  background-size: 31px 31px, 47px 47px, 73px 73px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.7;
}

main {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 520px;
  width: 100%;
  animation: fadeIn 1400ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- status ---------- */
.status {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 7px 18px;
  margin-bottom: 64px;
  background: rgba(13, 4, 20, 0.55);
  border: 1px solid var(--line);
  border-radius: 999px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--fg-3);
  text-transform: lowercase;
}
.status .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--orchid);
  box-shadow: 0 0 10px var(--orchid), 0 0 20px rgba(217, 70, 239, 0.4);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.45; transform: scale(0.92); }
}

/* ---------- ornament ---------- */
.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 12px;
  color: var(--fg-mute);
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 18px;
  letter-spacing: 0.6em;
}
.ornament .line {
  flex: 0 0 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
}

/* ---------- wordmark ---------- */
.mark {
  font-family: 'Instrument Serif', Georgia, serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(72px, 16vw, 152px);
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--fg);
  white-space: nowrap;
  text-shadow:
    0 0 30px rgba(196, 181, 253, 0.4),
    0 0 60px rgba(217, 70, 239, 0.25);
  margin-bottom: 4px;
}
.mark::after {
  content: "_";
  display: inline-block;
  margin-left: 0.05em;
  color: var(--orchid);
  font-style: normal;
  transform: translateY(-0.1em);
  animation: blink 1.1s steps(2, start) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- tagline ---------- */
.tagline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 22px;
  line-height: 1.45;
  color: var(--fg-2);
  margin-top: 14px;
  margin-bottom: 12px;
  max-width: 420px;
  margin-left: auto;
  margin-right: auto;
}
.tagline em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--violet-300);
}

.subline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--fg-3);
  text-transform: lowercase;
  margin-bottom: 56px;
}
.subline span { color: var(--orchid); }

/* ---------- links ---------- */
.links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 56px;
}
.link {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 12px 18px;
  background: rgba(26, 10, 35, 0.5);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--fg);
  text-decoration: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: lowercase;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 280ms cubic-bezier(0.22, 1, 0.36, 1);
}
.link svg { width: 15px; height: 15px; }
.link .arrow {
  color: var(--fg-3);
  font-size: 14px;
  transition: transform 280ms cubic-bezier(0.22, 1, 0.36, 1), color 280ms;
}
.link:hover {
  background: rgba(76, 29, 149, 0.4);
  border-color: var(--orchid);
  color: var(--fg);
  box-shadow:
    0 0 30px rgba(217, 70, 239, 0.35),
    inset 0 0 30px rgba(217, 70, 239, 0.08);
}
.link:hover .arrow {
  transform: translate(2px, -2px);
  color: var(--orchid);
}
.link:active { transform: scale(0.97); }

/* ---------- footer ---------- */
footer {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--fg-3);
  white-space: nowrap;
}
footer .sep { color: var(--fg-mute); font-style: normal; }

/* ---------- ornate corner ornaments ---------- */
.corner {
  position: fixed;
  width: 36px; height: 36px;
  color: var(--line-strong);
  z-index: 1;
  font-family: 'Instrument Serif', serif;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.corner.tl { top: 22px; left: 22px; }
.corner.tr { top: 22px; right: 22px; }
.corner.bl { bottom: 22px; left: 22px; }
.corner.br { bottom: 22px; right: 22px; }

@media (max-width: 560px) {
  .tagline { font-size: 18px; }
  .link .label { display: none; }
  .link .label.always { display: inline; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
