<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nixiecon // transmission</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --void: #06030c;
  --violet: #a78bfa;
  --violet-deep: #8b5cf6;
  --magenta: #ec4899;
  --cyan: #67e8f9;
  --fg: #ede9fe;
  --fg-2: #a59cc4;
  --fg-3: #6b6184;
  --line: rgba(167, 139, 250, 0.2);
}

html, body { height: 100%; background: var(--void); color: var(--fg); font-family: 'JetBrains Mono', monospace; overflow: hidden; }

body {
  position: relative;
  display: grid;
  place-items: center;
  padding: 24px;
}

/* CRT scanlines */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    0deg,
    rgba(255, 255, 255, 0.02) 0px,
    rgba(255, 255, 255, 0.02) 1px,
    transparent 1px,
    transparent 3px
  );
}

/* CRT vignette + curve */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.6) 100%);
}

/* the bloom — eerie purple */
.bloom {
  position: fixed;
  left: 50%; top: 50%;
  width: 700px; height: 700px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(139, 92, 246, 0.5), transparent 60%);
  filter: blur(50px);
  pointer-events: none;
  z-index: 0;
  animation: drift 7s ease-in-out infinite;
}
@keyframes drift {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
  50%      { transform: translate(-50%, -52%) scale(1.05); opacity: 1; }
}

/* random scanline glitch */
.glitch-bar {
  position: fixed;
  left: 0; right: 0;
  height: 2px;
  background: var(--violet);
  opacity: 0.6;
  pointer-events: none;
  z-index: 11;
  mix-blend-mode: screen;
  animation: glitchbar 6.3s steps(1) infinite;
}
@keyframes glitchbar {
  0%, 100%  { top: 100%; opacity: 0; }
  1%        { top: 12%; opacity: 0.8; }
  2%        { top: 11.5%; opacity: 0.4; }
  3%        { top: 100%; opacity: 0; }
  44%       { top: 100%; opacity: 0; }
  45%       { top: 64%; opacity: 0.7; }
  47%       { top: 64.5%; opacity: 0; }
  77%       { top: 100%; opacity: 0; }
  78%       { top: 31%; opacity: 0.5; }
  79%       { top: 31%; opacity: 0; }
}

main {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 480px;
  width: 100%;
  animation: bootIn 1.2s steps(8) both;
}
@keyframes bootIn { from { opacity: 0; clip-path: inset(48% 0 48% 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }

/* ---------- status pill (borrowed from A) ---------- */
.tx {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  margin-bottom: 56px;
  background: rgba(6, 3, 12, 0.6);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--fg-3);
  text-transform: lowercase;
}
.tx .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--violet);
  box-shadow: 0 0 8px var(--violet);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: 0.2; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ---------- wordmark — subtle RGB-split glitch ---------- */
.mark-wrap {
  position: relative;
  display: inline-block;
  margin-bottom: 18px;
}
.mark {
  font-family: 'Instrument Serif', Georgia, serif;
  font-style: italic;
  font-size: clamp(64px, 14vw, 120px);
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--fg);
  white-space: nowrap;
  text-shadow: 0 0 40px rgba(167, 139, 250, 0.5);
  position: relative;
  z-index: 2;
}
.mark::after {
  content: "_";
  margin-left: 0.06em;
  color: var(--violet);
  font-style: normal;
  animation: blink 1.05s steps(2) infinite;
}
/* chromatic aberration layers — just a slight crossover */
.mark-wrap .ghost {
  position: absolute;
  inset: 0;
  font-family: 'Instrument Serif', Georgia, serif;
  font-style: italic;
  font-size: clamp(64px, 14vw, 120px);
  line-height: 1;
  letter-spacing: -0.04em;
  white-space: nowrap;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0.08;
}
.ghost.r { color: var(--magenta); transform: translateX(-0.25px); }
.ghost.c { color: var(--cyan);    transform: translateX(0.25px); }

/* ---------- tagline — single line ---------- */
.tagline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  line-height: 1.5;
  color: var(--fg-2);
  letter-spacing: 0.06em;
  margin-bottom: 40px;
  text-transform: lowercase;
  white-space: nowrap;
}
.tagline .key { color: var(--violet); margin-right: 2px; }
.tagline em {
  font-family: 'Instrument Serif', Georgia, serif;
  font-style: italic;
  font-size: 13px;
  letter-spacing: -0.01em;
  color: var(--fg);
  text-transform: none;
}

/* ---------- channels (icon-only squares) ---------- */
.channels {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-bottom: 56px;
}
.ch {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: rgba(20, 12, 36, 0.6);
  border: 1px solid var(--line);
  color: var(--fg-2);
  text-decoration: none;
  transition: background 160ms, border-color 160ms, color 160ms, box-shadow 160ms;
}
.ch svg { width: 14px; height: 14px; }
.ch .label { display: none; }
.ch:hover {
  background: rgba(36, 22, 64, 0.8);
  border-color: var(--violet);
  color: var(--violet);
  box-shadow: 0 0 16px rgba(167, 139, 250, 0.35);
}

/* ---------- footer (borrowed from A) ---------- */
footer {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--fg-3);
  text-transform: lowercase;
  white-space: nowrap;
}
footer .sep { color: rgba(167, 139, 250, 0.3); }

/* ---------- corner brackets — bigger, more menacing ---------- */
.br { position: fixed; width: 28px; height: 28px; border-color: var(--violet); z-index: 1; }
.br.tl { top: 20px; left: 20px;     border-top: 2px solid; border-left: 2px solid; }
.br.tr { top: 20px; right: 20px;    border-top: 2px solid; border-right: 2px solid; }
.br.bl { bottom: 20px; left: 20px;  border-bottom: 2px solid; border-left: 2px solid; }
.br.br { bottom: 20px; right: 20px; border-bottom: 2px solid; border-right: 2px solid; }
/* recovers from clobbered .br class on the footer span */
.br:not(footer) {}

@media (max-width: 520px) {
  .mark { font-size: 56px; }
  .tagline { font-size: 10px; white-space: normal; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
</head>
<body>

<div class="bloom"></div>
<div class="glitch-bar"></div>

<span class="br tl"></span>
<span class="br tr"></span>
<span class="br bl"></span>
<span class="br br"></span>

<main>
  <div class="tx">
    <span class="dot"></span>
    <span>online · sometimes</span>
  </div>

  <div class="mark-wrap">
    <span class="ghost r">nixiecon</span>
    <span class="ghost c">nixiecon</span>
    <span class="mark">nixiecon</span>
  </div>

  <p class="tagline">
    <span class="key">&gt;</span>geriatric millennial <em>&amp; chaos on a schedule</em>
  </p>

  <nav class="channels">
    <a class="ch" href="https://github.com" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.29-.01-1.04-.01-2.05-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.08 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 016 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.81 1.1.81 2.22 0 1.6-.02 2.89-.02 3.29 0 .32.22.7.83.58A12 12 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      <span class="label">github</span>
    </a>
    <a class="ch" href="mailto:hi@nixiecon.com" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
      <span class="label">email</span>
    </a>
  </nav>
</main>

<footer>
  <span>// nixiecon</span>
  <span class="sep">·</span>
  <span>est. 2026</span>
  <span class="sep">·</span>
  <span>made in the dark</span>
</footer>

</body>
</html>
